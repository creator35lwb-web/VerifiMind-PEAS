steps:
  # Build the container image, tagged with the commit SHA ONLY.
  # B-94-1/B-95-1: --build-arg bakes the source commit INTO the image as the
  # image-owned file /app/.build_commit_sha — the immutable identity the WP-B
  # failover evidence gate binds against. The identity travels with the
  # image; it is NEVER set at the service level.
  # (T S97 residual: the mutable ':latest' alias tag is REMOVED — no
  # authorized deploy path referenced it, and a mutable alias is exactly the
  # identity class this pipeline exists to eliminate.)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'
      - '--build-arg'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push commit-pinned image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA']

  # Deploy to Cloud Run — image update only, no env var changes (API keys persist across revisions)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verifimind-mcp-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      # NOTE (B-94-1): BUILD_COMMIT_SHA is deliberately NOT set here — it is
      # image-baked via --build-arg above. A service-level value would shadow
      # every future image's identity and let artifact B inherit artifact A's
      # failover evidence.
      - 'FIRESTORE_PROJECT_ID=$PROJECT_ID'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

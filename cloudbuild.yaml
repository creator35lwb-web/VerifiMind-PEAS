steps:
  # Build the container image and tag with commit SHA + latest.
  # B-94-1: --build-arg bakes the source commit INTO the image
  # (Dockerfile ARG COMMIT_SHA -> ENV BUILD_COMMIT_SHA) — the immutable
  # identity the WP-B failover evidence gate binds against. The identity
  # travels with the image; it is NEVER set at the service level.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:latest'
      - '--build-arg'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push commit-pinned image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA']

  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/verifimind-mcp-server:latest']

  # Deploy to Cloud Run — image update only, no env var changes (API keys persist across revisions)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verifimind-mcp-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--max-instances'
      - '3'
      - '--memory'
      - '512Mi'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      # NOTE (B-94-1): BUILD_COMMIT_SHA is deliberately NOT set here — it is
      # image-baked via --build-arg above. A service-level value would shadow
      # every future image's identity and let artifact B inherit artifact A's
      # failover evidence.
      - 'FIRESTORE_PROJECT_ID=$PROJECT_ID'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/verifimind-mcp-server:latest'

options:
  logging: CLOUD_LOGGING_ONLY

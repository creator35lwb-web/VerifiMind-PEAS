name: Public Documentation Contract
# The security workflow owns the Bandit check identity for every PR. This
# workflow validates public documentation without impersonating a security scan.
on:
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'wiki/**'
      - 'scripts/verify_public_docs_contract.py'
      - 'scripts/verify_security_ci_contract.py'
      - 'scripts/verify_python_sast_report.py'
      - 'scripts/verify_python_dependency_audit.py'
      - 'tests/test_security_ci_contract.py'
      - 'tests/test_python_sast_report_contract.py'
      - 'tests/test_python_dependency_audit_contract.py'
      - 'SECURITY.md'
      - '.macp-public/governance/SECURITY.md'
      - '.github/ISSUE_TEMPLATE/config.yml'
      - '.github/workflows/**'
      - 'LICENSE'
      - '.gitignore'
      - '**.txt'
      - '**.rst'
      - 'server.json'
      - 'sonar-project.properties'
      - '.sonarcloud.properties'
      - 'cloudbuild.yaml'
permissions:
  contents: read
jobs:
  public-docs-contract:
    name: Public Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify public documentation contract
        run: python scripts/verify_public_docs_contract.py

      - name: Verify security CI contract
        run: python scripts/verify_security_ci_contract.py

      - name: Run security contract regression tests
        run: >-
          python -m unittest discover -s tests
          -p 'test_*_contract.py' -v

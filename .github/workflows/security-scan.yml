name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly: Sunday at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit-sast:
    name: Bandit SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify security CI contract
        run: python scripts/verify_security_ci_contract.py

      - name: Install Bandit
        # --only-binary :all: refuses source distributions, so no setup.py can run
        # during the install (SonarCloud githubactions:S8541). Every package in
        # this pinned tree ships a wheel for the runner's Python. Block scalar
        # because ':all:' is not a valid plain YAML scalar.
        run: |
          python -m pip install --disable-pip-version-check --only-binary :all: 'bandit[toml]==1.9.4'

      - name: Run Bandit security scan
        run: |
          echo "Running Bandit SAST analysis on mcp-server/src/ and http_server.py..."
          cd mcp-server
          rm -f ../bandit-report.json
          set +e
          bandit -r src/ http_server.py -ll -ii --skip B101 -f json -o ../bandit-report.json
          scan_status=$?
          set -e
          cd ..
          python scripts/verify_python_sast_report.py --scan-exit-code "$scan_status"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Security scan summary
        if: always()
        run: |
          echo "## Bandit SAST Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            ISSUES=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len(d.get('results',[])))" 2>/dev/null || echo "unknown")
            echo "Issues found: $ISSUES" >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

  python-dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        # --only-binary :all: for the same reason as the Bandit install above.
        run: |
          python -m pip install --disable-pip-version-check --only-binary :all: 'pip-audit==2.10.1'

      - name: Audit deployment dependencies
        run: |
          rm -f pip-audit-report.json
          set +e
          python -m pip_audit \
            --strict \
            --progress-spinner off \
            --format json \
            --output pip-audit-report.json \
            mcp-server
          audit_status=$?
          set -e
          python scripts/verify_python_dependency_audit.py --audit-exit-code "$audit_status"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dependency-audit-report
          path: pip-audit-report.json
          if-no-files-found: error
          retention-days: 90

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Job-level permissions required to upload SARIF results to the security tab.
    # Regression context: once any job in the workflow declared explicit permissions
    # (bandit-sast did, per SonarCloud V1), GitHub switched the whole workflow to
    # job-level permissioning. Jobs without an explicit block fall to a minimal
    # default that excludes security-events:write, causing CodeQL upload to fail
    # with "Resource not accessible by integration" on every push to main since
    # v0.5.31. Same scopes the bandit-sast job uses, plus actions:read which the
    # CodeQL action needs for tool-cache + workflow metadata reads.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:python"

      - name: CodeQL summary
        if: always()
        run: |
          echo "## CodeQL Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CodeQL semantic analysis completed for Python code" >> $GITHUB_STEP_SUMMARY
